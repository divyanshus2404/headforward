# Publishes to PyPI when you publish a GitHub release.
# Uses PyPI trusted publishing, so no API token is stored in the repo.
# One-time setup on pypi.org: Account > Publishing > Add a pending publisher
#   project: leantokens, owner: divyanshus2404, repo: leantokens,
#   workflow: publish.yml, environment: pypi
name: publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
